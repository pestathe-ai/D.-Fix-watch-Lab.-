name: d_fix_watch_lab
description: "D. Fix Watch Lab – guida passo passo alla revisione di orologi meccanici."
publish_to: 'none'
version: 0.12.2+15

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  record: ^7.1.2
  webview_flutter: ^4.10.0
  google_mlkit_text_recognition: '>=0.13.0 <2.0.0'
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/web3d/
    - assets/renders/
    - assets/renders/parts/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1D3A8A"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 24
  remove_alpha_ios: true
